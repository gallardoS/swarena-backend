name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gallardos/swarena-backend

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@"$EC2_HOST" 'mkdir -p /opt/swarena-backend'
          scp deploy/compose.prod.yml deploy/Caddyfile ubuntu@"$EC2_HOST":/opt/swarena-backend/

      - name: Deploy image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh ubuntu@"$EC2_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh ubuntu@"$EC2_HOST" \
            "cd /opt/swarena-backend && IMAGE_TAG='${{ github.sha }}' docker compose -f compose.prod.yml pull && IMAGE_TAG='${{ github.sha }}' docker compose -f compose.prod.yml up -d --wait"
          ssh ubuntu@"$EC2_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'
