name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gallardos/swarena-backend

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: test-and-publish
    runs-on:
      - self-hosted
      - linux
      - x64
      - swarena-production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deployment configuration
        run: |
          sudo install -d -m 755 -o "$USER" -g "$USER" /opt/swarena-backend
          install -m 644 deploy/compose.prod.yml /opt/swarena-backend/compose.prod.yml
          install -m 644 deploy/Caddyfile /opt/swarena-backend/Caddyfile

      - name: Grant leaderboard database access
        run: sh deploy/grant-leaderboard-read.sh

      - name: Deploy image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd /opt/swarena-backend
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d --wait

      - name: Log out from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
