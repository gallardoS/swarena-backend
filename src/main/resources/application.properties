spring.application.name=arena
spring.config.import=optional:file:.env[.properties]

# Public account registration can be disabled without rebuilding the application.
swarena.registration.enabled=${SWARENA_REGISTRATION_ENABLED:true}
swarena.registration.expansion=${SWARENA_REGISTRATION_EXPANSION:2}

# Internal AzerothCore endpoints used by the public server-status check.
swarena.server.auth-host=${SWARENA_SERVER_AUTH_HOST:ac-authserver}
swarena.server.auth-port=${SWARENA_SERVER_AUTH_PORT:3724}
swarena.server.world-host=${SWARENA_SERVER_WORLD_HOST:ac-worldserver}
swarena.server.world-port=${SWARENA_SERVER_WORLD_PORT:8085}
swarena.server.connect-timeout=${SWARENA_SERVER_CONNECT_TIMEOUT:1s}
swarena.server.cache-ttl=${SWARENA_SERVER_CACHE_TTL:10s}

# Public arena leaderboard results are cached briefly to limit database traffic.
swarena.leaderboard.cache-ttl=${SWARENA_LEADERBOARD_CACHE_TTL:30s}

# Cloudflare Turnstile is required before account creation reaches AzerothCore.
turnstile.secret=${TURNSTILE_SECRET:}
turnstile.hostnames=${TURNSTILE_HOSTNAMES:}

# Keep actuator information minimal when the service is exposed publicly.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
