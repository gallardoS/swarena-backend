# Keep tests independent from the local AzerothCore MySQL container.
spring.datasource.url=jdbc:h2:mem:swarena;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

swarena.server.auth-host=ac-authserver
swarena.server.auth-port=3724
swarena.server.world-host=ac-worldserver
swarena.server.world-port=8085
swarena.server.connect-timeout=1s
swarena.server.cache-ttl=10s
